<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Waterwise - Forecast</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/Waterwise.css">
</head>

<body>
<div class="forecast">
    <header>
        <div class="nav-container">
            <a href="/">
                <img src="/Waterwise-logo.jpg" alt="Waterwise logo" class="logoimage">
            </a>

            <nav>
                <a href="/watercalculator" class="navitem">Water calculator</a>
                <a href="/logs" class="navitem">Logs</a>
                <a href="/about-us" class="navitem">About us</a>
                <a href="/forecast" class="navitem">Forecast</a>

            </nav>
            <button class="login-button"
                    id="open_login"
                    th:if="${username == null}">
                Login
            </button>
            <span class="username"
                  th:if="${username != null}"
                  th:text="${username}">
                </span>
            <form action="/logout" method="post" th:if="${username !=null}">
                <button type="submit" class="logout-button">Logout</button>
            </form>
        </div>
    </header>
    <h1>Water forecast</h1>
</div>


<main class="forecast-main">
    <section class="rain-panel">
        <h2>Rain forecast</h2>
        <p class="forecast-subtitle">
            Gothenburg · 7 days, including today
        </p>

        <p id="forecast-status" role="status">
            Loading forecast...
        </p>

        <div id="forecast-content" hidden>
            <div class="forecast-summary">
                <div class="summary-card">
                    <span>Total expected rainfall</span>
                    <strong id="total-rain">—</strong>
                    <small>Over the forecast period</small>
                </div>

                <div class="summary-card">
                    <span>Wettest day</span>
                    <strong id="wettest-day">—</strong>
                    <small id="wettest-amount">—</small>
                </div>
            </div>

            <div class="rain-chart-container">
                <canvas id="rainChart"></canvas>
            </div>
        </div>
    </section>
</main>


<footer>
    <p>© 2026 WaterWise Water Usage Tracker</p>
</footer>

<div class="popup-container" id="popup_container">
    <div class="login-box">
        <form action="/login" method="post" class="login-form" id="login_form">
            <h2>Login</h2>
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <div class="btn-holder">
                <button type="submit">Login</button>
                <button type="button" id="create_account">Create Account</button>
                <button type="button" id="close_login">Close</button>
            </div>

        </form>
        <form action="/register" method="post" class="login-form" id="register_form" style="display: none;">
            <h2>Create Account</h2>

            <label for="register_username">Username: </label><br>
            <input type="text" id="register_username" name="username" required><br>

            <label for="register_password">Password: </label><br>
            <input type="password" id="register_password" name="password" required><br>

            <label for="confirm_password">Confirm Password: </label><br>
            <input type="password" id="confirm_password" name="confirmPassword" required><br><br>

            <div class="btn-holder">
                <button type="submit">Create Account</button>
                <button type="button" id="back_to_login">Back to Login</button>
                <button type="button" id="close_register">Close</button>
            </div>
        </form>
    </div>
</div>

<script src="/Scripts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/GraphGen.js"></script>

</body>

</html>
